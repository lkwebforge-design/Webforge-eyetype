name: iOS simulator build

on:
  push:
    branches: [main]
    paths:
      - "ios/**"
      - ".github/workflows/ios-build.yml"
  pull_request:
    branches: [main]
    paths:
      - "ios/**"
      - ".github/workflows/ios-build.yml"
  workflow_dispatch:

jobs:
  simulator-build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate --spec project.yml
      - name: Build iOS simulator app
        run: |
          xcodebuild \
            -project ios/EyeType.xcodeproj \
            -scheme EyeType \
            -sdk iphonesimulator \
            -configuration Debug \
            -derivedDataPath build/ios-derived \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Package simulator app
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            build/ios-derived/Build/Products/Debug-iphonesimulator/EyeType.app \
            EyeType-iOS-Simulator.zip
      - name: Upload simulator build
        uses: actions/upload-artifact@v4
        with:
          name: EyeType-iOS-Simulator
          path: EyeType-iOS-Simulator.zip
          if-no-files-found: error
          retention-days: 7
